[package]
name = "researchclip"
version = "0.1.1"
description = "Local research screenshot and knowledge card workspace"
edition = "2024"
rust-version = "1.99"

[lib]
name = "researchclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
png = "0.18.1"
tempfile = "3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange"] }
