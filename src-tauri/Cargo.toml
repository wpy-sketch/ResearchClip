[package]
name = "researchclip"
version = "0.1.0"
description = "Local research screenshot and knowledge card workspace"
edition = "2024"
rust-version = "1.99"

[lib]
name = "researchclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
