<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResearchClip 网页剪藏</title></head><body><main><header><span class="logo">R</span><div><h1>ResearchClip</h1><p>网页剪藏 · 仅保存你选择的内容</p></div></header><section><label for="mode">剪藏方式</label><select id="mode"><option value="link">网页链接与来源</option><option value="selection">选中的文字</option><option value="article">网页主要正文</option><option value="images">选择页面图片</option></select><div class="actions"><button id="prepare">读取当前页并预览</button><button id="connect" class="quiet">刷新项目连接</button></div></section><p id="status" role="status">先选择方式，再读取当前页。首次使用请在桌面设置启用网页剪藏连接。</p><section id="preview" hidden><label for="title">标题</label><input id="title" maxlength="200"><label for="project">保存到项目</label><select id="project"><option value="">未分类</option></select><div id="images" aria-label="选择图片"></div><label class="check"><input id="copy" type="checkbox">允许复制可访问的远程图片</label><p class="hint">仅尝试当前站点同源HTTPS图片，不发送Cookie。最多4图、单张256 KiB、合计384 KiB；跨域或失败保留来源。</p><label for="markdown">Markdown 内容预览</label><textarea id="markdown" readonly rows="12"></textarea><div class="actions"><button id="save">保存到 ResearchClip</button><button id="cancel" class="quiet">取消等待</button></div></section><footer>只在点击时读取当前页面，不监视浏览记录。<br>保存后在桌面提示中打开 Markdown 编辑。</footer></main><script type="module" src="/src/popup.ts"></script></body></html>
