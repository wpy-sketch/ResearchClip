name: Restore verified v3.1.9 release executable
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-v319-artifact-transfer
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'wpy-sketch/ResearchClip' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Restore exact tested bytes and attach only the missing executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,ssl,urllib.request,urllib.parse
          base='https://api.github.com/repos/wpy-sketch/ResearchClip'
          name='ResearchClip-v3.1.9-windows-x64.exe'
          size=27889664
          expected='1ae637e26d0d79589d40095f61108bf7f44e612fa52bd233dcd88cd6ac4cc6d5'
          source='8b2e4ab0c7283a6210886ccdc759b5d04ff62e97'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          client=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ssl.create_default_context()),NoRedirect())
          def request(url,data=None):
              assert urllib.parse.urlsplit(url).hostname in ['api.github.com','uploads.github.com']
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ResearchClip-Verified-Transfer','X-GitHub-Api-Version':'2022-11-28'}
              if data is not None: headers['Content-Type']='application/octet-stream'
              with client.open(urllib.request.Request(url,data=data,headers=headers),timeout=120) as response:
                  return json.loads(response.read(20*1024*1024))
          release=request(base+'/releases/420200131')
          assert release['draft'] and release['tag_name']=='v3.1.9' and release['target_commitish']==source
          assert request(base+'/git/ref/tags/v3.1.9')['object']['sha']==source
          current=next((a for a in release['assets'] if a['name']==name),None)
          if current:
              assert current['state']=='uploaded' and current['size']==size and current['digest']=='sha256:'+expected
              print('Existing executable verified; no write performed.')
          else:
              blob=request(base+'/git/blobs/b95c4b2ec6901fb84a0cea00028a795b39392162')
              assert blob['encoding']=='base64' and blob['size']==9027436
              compressed=base64.b64decode(''.join(blob['content'].split()),validate=True)
              assert len(compressed)==9027436 and hashlib.sha256(compressed).hexdigest()=='3ab5a7405be45dbd2ca64baf84e0a007326e69cc88ef3c44bad4529cac34533f'
              decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
              data=decoder.decompress(compressed,max_length=size+1)
              assert decoder.eof and not decoder.unused_data and len(data)==size and hashlib.sha256(data).hexdigest()==expected
              url=release['upload_url'].split('{')[0]
              assert url=='https://uploads.github.com/repos/wpy-sketch/ResearchClip/releases/420200131/assets'
              asset=request(url+'?'+urllib.parse.urlencode({'name':name}),data)
              assert asset['name']==name and asset['state']=='uploaded' and asset['size']==size and asset['digest']=='sha256:'+expected
              print('Restored tested executable; uploaded size and server SHA256 match: '+expected)
          PY
