<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320"><rect width="1000" height="320" rx="20" fill="#182331"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="45" font-size="22" fill="#e3e9f2">公式图片 → 可编辑 LaTeX（操作示意，非实际窗口截图）</text><rect x="30" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="45" y="117" fill="#b3d0ff" font-size="20">01 配置</text><text x="45" y="157" fill="#e3e9f2" font-size="13">Python运行时 + 主动下载模型</text><rect x="270" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="285" y="117" fill="#b3d0ff" font-size="20">02 识别</text><text x="285" y="157" fill="#e3e9f2" font-size="13">整图 / 原图像素框选</text><rect x="510" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="525" y="117" fill="#b3d0ff" font-size="20">03 校对</text><text x="525" y="157" fill="#e3e9f2" font-size="13">编辑源码 + 安全预览</text><rect x="750" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="765" y="117" fill="#b3d0ff" font-size="20">04 确认</text><text x="765" y="157" fill="#e3e9f2" font-size="13">复制 / 插入Markdown / 追加笔记</text><text x="30" y="250" fill="#ffc999" font-size="17">务必核对：变量、上下标、等号/不等号、箭头、求和边界、矩阵与多行结构。</text><text x="30" y="284" fill="#c5d0de" font-size="15">能渲染不代表正确；识别结果永远标注为未经数学正确性验证。</text></g></svg>