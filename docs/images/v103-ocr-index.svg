<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><rect width="1000" height="300" rx="20" fill="#182331"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="45" font-size="23" fill="#e3e9f2">OCR 全文检索 · 操作路线（示意图）</text><rect x="30" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="45" y="116" fill="#b3d0ff" font-size="20">01 素材库</text><text x="45" y="155" fill="#e3e9f2" font-size="13">展开 OCR 全文索引</text><rect x="270" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="285" y="116" fill="#b3d0ff" font-size="20">02 主动开始</text><text x="285" y="155" fill="#e3e9f2" font-size="13">选语言 → 允许本次扫描</text><rect x="510" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="525" y="116" fill="#b3d0ff" font-size="20">03 检索</text><text x="525" y="155" fill="#e3e9f2" font-size="13">顶部输入 → 来源选 OCR</text><rect x="750" y="80" width="220" height="125" rx="12" fill="#25374a" stroke="#56708b"/><text x="765" y="116" fill="#b3d0ff" font-size="20">04 校对</text><text x="765" y="155" fill="#e3e9f2" font-size="13">打开卡片 → OCR 全文与纠错</text><text x="30" y="250" fill="#c5d0de" font-size="16">暂停 / 取消保留已完成记录；修改 OCR 后需点击「保存纠错」。原图与手写笔记分开保留。</text></g></svg>