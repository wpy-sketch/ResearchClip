<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"><rect width="1040" height="400" rx="22" fill="#18212d"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#e3e9f2"><text x="32" y="42" font-size="23">标注版本历史：一次保存，一个可编辑快照</text><text x="32" y="70" fill="#afbacb" font-size="14">操作示意图，非实际窗口截图。所有版本引用同一张不可变原图。</text><g fill="#26364a" stroke="#5b7496"><rect x="32" y="105" width="225" height="150" rx="14"/><rect x="300" y="105" width="225" height="150" rx="14"/><rect x="568" y="105" width="225" height="150" rx="14"/><rect x="835" y="105" width="173" height="150" rx="14"/></g><g font-size="18"><text x="52" y="140">v1 首次保存</text><text x="320" y="140">v2 修改标注</text><text x="588" y="140">v3 恢复 v1</text><text x="855" y="140">继续编辑</text></g><g font-size="15" fill="#c5cfdd"><text x="52" y="179">原图 + 标注 JSON</text><text x="52" y="211">时间 / 版本说明</text><text x="320" y="179">v1 仍然保留</text><text x="320" y="211">预览与对比不改草稿</text><text x="588" y="179">v2 仍然保留</text><text x="588" y="211">父版本为当前 v2</text><text x="855" y="179">保存生成 v4</text><text x="855" y="211">撤销独立工作</text></g><g fill="#a8c7fa" font-size="26"><text x="269" y="186">→</text><text x="537" y="186">→</text><text x="805" y="186">→</text></g><text x="32" y="300" font-size="17">① 素材库打开编辑器 → ② 填写版本说明并保存 → ③ 版本历史中预览 / 对比</text><text x="32" y="334" font-size="17">④ 恢复前先保存未保存草稿 → ⑤ 确认恢复为新版本 → ⑥ 继续编辑</text><text x="32" y="372" fill="#afbacb" font-size="14">同内容不重复创建；不自动清理历史；删除整张素材会删除该素材的历史，请核对确认框。</text></g></svg>