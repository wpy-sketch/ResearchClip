<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><rect width="1100" height="530" rx="18" fill="#f5f7fa"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="42" y="53" font-size="25" fill="#243247">WebDAV · 手动同步与冲突处理</text><text x="42" y="85" font-size="15" fill="#53657d">流程示意｜各设备独立数据库｜不上传 SQLite｜不代表具体服务商已通过验收</text><g fill="#fff" stroke="#ccd5e0"><rect x="42" y="124" width="295" height="122" rx="12"/><rect x="402" y="124" width="295" height="122" rx="12"/><rect x="762" y="124" width="295" height="122" rx="12"/><rect x="42" y="316" width="295" height="150" rx="12"/><rect x="402" y="316" width="295" height="150" rx="12"/><rect x="762" y="316" width="295" height="150" rx="12"/></g><g fill="#234f8e" font-size="19"><text x="63" y="159">1 · 本机明确选择</text><text x="423" y="159">2 · 测试安全写入</text><text x="783" y="159">3 · 资源级传输</text><text x="63" y="354">只有一端修改</text><text x="423" y="354">两端同时修改</text><text x="783" y="354">远端删除 / 连接中断</text></g><g fill="#36485f" font-size="16"><text x="63" y="192">保存草稿、选项目</text><text x="63" y="220">凭据留在系统安全存储</text><text x="423" y="192">强 ETag + 条件并发探针</text><text x="423" y="220">不可靠 → 停止，不强制覆盖</text><text x="783" y="192">校验 hash 与完整依赖</text><text x="783" y="220">提交 catalog 后确认队列</text><text x="63" y="390">安全传输后更新本机基线</text><text x="63" y="420">相同内容不重复上传</text><text x="423" y="390">保留双方 → 逐项确认</text><text x="423" y="420">本地 / 远端 / 保留两者</text><text x="783" y="390">删除须确认，不推断缺失</text><text x="783" y="420">中断保留队列，手动重试</text></g><g stroke="#8aa1bf" stroke-width="2" fill="none"><path d="M344 184h48m-8 -6 8 6-8 6M704 184h48m-8-6 8 6-8 6M550 254v48m-6-8 6 8 6-8"/></g><text x="42" y="503" fill="#53657d" font-size="14">接收 Markdown 使用新受管目录；原文件与不可变原图保留。停止等待当前请求结束，最多约 30 秒。</text></g></svg>